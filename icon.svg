<svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 200 200">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="200" height="200" rx="24" fill="#1E2A3A"/>

  <!-- Beam line -->
  <line x1="20" y1="130" x2="180" y2="130" stroke="#4A90D9" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Left pin support -->
  <polygon points="20,130 12,148 28,148" fill="#4A90D9"/>
  <line x1="8" y1="150" x2="32" y2="150" stroke="#4A90D9" stroke-width="2" stroke-linecap="round"/>

  <!-- Middle support -->
  <polygon points="100,130 92,148 108,148" fill="#4A90D9" opacity="0.75"/>
  <line x1="88" y1="150" x2="112" y2="150" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <!-- Right roller support -->
  <polygon points="180,130 172,148 188,148" fill="#4A90D9"/>
  <circle cx="175" cy="152" r="3" fill="#4A90D9"/>
  <circle cx="183" cy="152" r="3" fill="#4A90D9"/>
  <line x1="168" y1="156" x2="192" y2="156" stroke="#4A90D9" stroke-width="2" stroke-linecap="round"/>

  <!-- Positive influence area (span 1) -->
  <path d="M20,130 Q60,78 100,130" fill="#F2A623" fill-opacity="0.18"/>
  <path d="M20,130 Q60,78 100,130" stroke="#F2A623" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Negative influence area (span 2) -->
  <path d="M100,130 Q140,150 180,130" fill="#E85D24" fill-opacity="0.18"/>
  <path d="M100,130 Q140,150 180,130" stroke="#E85D24" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Node dots -->
  <circle cx="20"  cy="130" r="4" fill="#4A90D9"/>
  <circle cx="100" cy="130" r="4" fill="#4A90D9"/>
  <circle cx="180" cy="130" r="4" fill="#4A90D9"/>

  <!-- Moving load arrow -->
  <circle cx="100" cy="38" r="4" fill="#F2A623"/>
  <line x1="100" y1="42" x2="100" y2="72" stroke="#F2A623" stroke-width="2.5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Label -->
  <text x="100" y="190" text-anchor="middle"
        font-family="Arial, sans-serif" font-size="13" font-weight="500"
        fill="#E8F4FF">Influence Line</text>
</svg>
