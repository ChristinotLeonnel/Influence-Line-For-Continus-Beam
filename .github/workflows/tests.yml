# =============================================================================
#  tests.yml — compilation + tests natifs C++ (ctest) + tests Python (pytest)
#  sur Linux (GCC) et Windows (MSVC), à chaque push et pull request.
#
#  Le module est construit par CMake seul, puis importé via
#  PYTHONPATH=build/python : cela vérifie aussi que l'extension compilée est
#  bien placée à côté du paquet Python (sinon l'import échoue).
# =============================================================================
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }} • Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install Python dependencies
        run: python -m pip install --upgrade pip pybind11 numpy pytest

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTSARALOHA_BUILD_TESTS=ON -DTSARALOHA_BUILD_EXAMPLES=ON -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"
        shell: bash

      - name: Build
        run: cmake --build build --config Release -j 4

      - name: Native C++ tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Python tests
        run: python -m pytest -p no:cacheprovider
        env:
          PYTHONPATH: build/python
