# =============================================================================
#  wheels.yml — Build & publish Tsaraloha (Windows uniquement)
#
#  1) build_wheels   : compile une wheel précompilée Windows x64 par version
#                       Python via cibuildwheel.
#  2) build_sdist    : construit la source distribution (.tar.gz), utilisée
#                       en secours si l'utilisateur compile depuis les sources.
#  3) publish_pypi   : ne s'exécute QUE sur un tag "v*" (ex. v1.0.0) et
#                       publie tout sur PyPI via Trusted Publishing (OIDC,
#                       aucun secret/token à stocker dans le repo).
#
#  Déclenchement :
#    - push d'un tag "v*"        -> build + publish sur PyPI
#    - déclenchement manuel      -> build seul (pour tester sans publier)
#    - pull_request               -> build seul (validation avant merge)
# =============================================================================
name: Build & publish wheels

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1) Wheel précompilée Windows x64 (une par version Python)
  # ---------------------------------------------------------------------------
  build_wheels:
    name: Wheels • windows-latest
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        # La config complète (versions Python ciblées, test-command...)
        # vit dans [tool.cibuildwheel] de pyproject.toml.

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: ./wheelhouse/*.whl

  # ---------------------------------------------------------------------------
  # 2) Source distribution (secours : compilation depuis les sources)
  # ---------------------------------------------------------------------------
  build_sdist:
    name: Source distribution
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # 3) Publication PyPI — uniquement sur un tag "vX.Y.Z"
  # ---------------------------------------------------------------------------
  publish_pypi:
    name: Publier sur PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/Tsaraloha
    permissions:
      id-token: write   # requis par le Trusted Publishing (OIDC), pas de token à gérer

    steps:
      - name: Récupérer les wheels + le sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publier sur PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Pas de "password:" / "api-token:" -> repose entièrement sur le
        # Trusted Publishing configuré côté pypi.org.
