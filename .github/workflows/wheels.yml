# =============================================================================
#  wheels.yml — Build & publish Tsaraloha (modèle "comme numpy")
#
#  1) build_wheels   : compile une wheel précompilée par plateforme/version
#                       Python via cibuildwheel (Windows, Linux, macOS
#                       x86_64 + arm64).
#  2) build_sdist    : construit la source distribution (.tar.gz), utilisée
#                       en secours si aucune wheel ne correspond à la
#                       plateforme de l'utilisateur.
#  3) publish_pypi   : ne s'exécute QUE sur un tag "v*" (ex. v1.0.0) et
#                       publie tout sur PyPI via Trusted Publishing (OIDC,
#                       aucun secret/token à stocker dans le repo).
#
#  Déclenchement :
#    - push d'un tag "v*"        -> build + publish sur PyPI
#    - déclenchement manuel      -> build seul (pour tester sans publier)
#    - pull_request               -> build seul (validation avant merge)
# =============================================================================
name: Build & publish wheels

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1) Wheels précompilées (une par OS x arch x version Python)
  # ---------------------------------------------------------------------------
  build_wheels:
    name: Wheels • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-13, macos-14]
        # ubuntu-latest -> manylinux x86_64 (via cibuildwheel, voir pyproject.toml)
        # windows-latest -> win_amd64
        # macos-13       -> macOS x86_64 (Intel)
        # macos-14       -> macOS arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        # La config complète (versions Python ciblées, image manylinux,
        # MACOSX_DEPLOYMENT_TARGET, test-command...) vit dans
        # [tool.cibuildwheel] de pyproject.toml.

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  # ---------------------------------------------------------------------------
  # 2) Source distribution (secours si pas de wheel pour la plateforme)
  # ---------------------------------------------------------------------------
  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # ---------------------------------------------------------------------------
  # 3) Publication PyPI — uniquement sur un tag "vX.Y.Z"
  # ---------------------------------------------------------------------------
  publish_pypi:
    name: Publier sur PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/Tsaraloha
    permissions:
      id-token: write   # requis par le Trusted Publishing (OIDC), pas de token à gérer

    steps:
      - name: Récupérer toutes les wheels + le sdist
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: sdist
          path: dist

      - name: Publier sur PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # Pas de "password:" / "api-token:" -> repose entièrement sur le
        # Trusted Publishing configuré côté pypi.org (voir README pour la
        # démarche de configuration, à faire une seule fois).
