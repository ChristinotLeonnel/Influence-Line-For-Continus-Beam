# =============================================================================
#  wheels.yml — Build & publish Tsaraloha (un seul moteur : l'extension C++)
#
#  1) build_wheels : wheels précompilées via cibuildwheel, une par plateforme
#                    et par version de CPython :
#                      Windows x64, Linux x86_64 + aarch64 (manylinux),
#                      macOS x86_64 + arm64.
#                    Chaque wheel est testée avec la suite pytest complète.
#  2) build_sdist  : source distribution (.tar.gz) — repli : pip compile depuis
#                    les sources (compilateur C++20 + CMake requis).
#  3) publish_pypi : uniquement sur un tag "v*" (ex. v2.0.0), via Trusted
#                    Publishing (OIDC, aucun secret dans le dépôt).
#  4) github_release : release GitHub avec tous les artefacts.
#
#  La configuration cibuildwheel (versions Python, tests) est dans
#  [tool.cibuildwheel] de pyproject.toml.
# =============================================================================
name: Build & publish wheels

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

jobs:
  build_wheels:
    name: Wheels • ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm : runner ARM natif (aarch64) ; macos-13 = Intel,
        # macos-14 = Apple Silicon.
        os: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-14]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.1.4

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade build
          python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish_pypi:
    name: Publier sur PyPI
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/Tsaraloha
    permissions:
      id-token: write   # Trusted Publishing (OIDC)

    steps:
      - name: Récupérer tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Lister les fichiers à publier
        run: ls -la dist/

      - name: Publier sur PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  github_release:
    name: Créer la Release GitHub
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Télécharger tous les artefacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Créer la Release GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
