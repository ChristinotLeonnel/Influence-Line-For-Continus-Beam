[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "Tsaraloha"
version = "2.0.0"
description = "Tsaraloha : librairie chapeau regroupant plusieurs sous-librairies de calcul. Sous-librairie actuelle : LIPoutreContinue, analyse structurelle de poutres continues (lignes d'influence, enveloppes de charge, isostatique/hyperstatique)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Proprietary" }
authors = [{ name = "Tsaraloha" }]
keywords = [
    "structural-analysis",
    "beam",
    "influence-line",
    "civil-engineering",
    "finite-element",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

dependencies = ["numpy>=1.20"]

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
report = ["weasyprint"]
all = ["matplotlib>=3.5", "weasyprint"]


# [project.urls]
# Homepage = "https://github.com/ChristinotLeonnel/Influence-Line-For-Continus-Beam"
# Source   = "https://github.com/ChristinotLeonnel/Influence-Line-For-Continus-Beam"
# Issues   = "https://github.com/ChristinotLeonnel/Influence-Line-For-Continus-Beam/issues"

[tool.scikit-build]
# Le code source C++ vit à la racine (CMakeLists.txt), organisé par
# sous-librairie (ex. LIPoutreContinue/include, LIPoutreContinue/src,
# LIPoutreContinue/bindings). Le paquet Python pur (__init__.py, .pyi,
# py.typed, plot.py) vit dans python/Tsaraloha/ (racine du namespace) et
# python/Tsaraloha/LIPoutreContinue/ (sous-librairie), et est copié à côté
# de l'extension compilée par le CMakeLists.txt lui-même (voir la section
# "Module Python" dans CMakeLists.txt).
wheel.packages = ["python/Tsaraloha"]
cmake.build-type = "Release"

# Contenu de la source distribution (sdist) — nécessaire pour que
# `pip install Tsaraloha` puisse, en dernier recours (plateforme sans
# wheel précompilée), reconstruire depuis les sources.
sdist.include = [
    "CMakeLists.txt",
    "LIPoutreContinue/",
    "include/",
    "python/",
    "tests/",
    "CHANGELOG.md",
]
sdist.exclude = [
    ".github/",
    "*.rar",
    "exemple/",
    "google_veo_script.md",
]
# Les tests sont inclus dans le sdist pour pouvoir valider un build depuis
# les sources (cibuildwheel les exécute depuis {project}).

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
xfail_strict = true

[tool.scikit-build.cmake.define]
TSARALOHA_BUILD_PYTHON = "ON"
TSARALOHA_BUILD_EXAMPLES = "OFF"

# =============================================================================
#  cibuildwheel — construit une wheel précompilée par plateforme/version
#  Python (Windows/Linux/macOS, x86_64 + arm64), pilotée par
#  .github/workflows/wheels.yml. Voir https://cibuildwheel.pypa.io
# =============================================================================
[tool.cibuildwheel]
# CPython 3.9 -> 3.14 ; PyPy exclu. Plateformes : voir la matrice de
# .github/workflows/wheels.yml (Windows, Linux x86_64/aarch64, macOS x86_64/arm64).
build = "cp39-* cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = ["pp*", "*-musllinux_i686", "*-manylinux_i686", "*-win32"]
build-verbosity = 1

# Chaque wheel est validée par la suite de tests complète (oracle Clapeyron,
# régressions, enveloppes), pas seulement par un import.
test-requires = ["pytest", "numpy"]
test-command = "pytest {project}/tests -p no:cacheprovider -q"

[tool.cibuildwheel.macos]
# std::filesystem (utilisé par l'export JSON) requiert macOS >= 10.15.
environment = { MACOSX_DEPLOYMENT_TARGET = "10.15" }
