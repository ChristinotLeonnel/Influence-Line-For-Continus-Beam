<svg xmlns="http://www.w3.org/2000/svg" width="400" height="120" viewBox="0 0 400 120">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="400" height="120" rx="16" fill="#1E2A3A"/>

  <!-- ── Beam graphic (left zone x=16..200) ─────────────────────────────── -->

  <!-- Beam line -->
  <line x1="18" y1="72" x2="198" y2="72" stroke="#4A90D9" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Supports: left pin, mid, right roller -->
  <polygon points="18,72 12,84 24,84" fill="#4A90D9"/>
  <line x1="8"  y1="86" x2="28"  y2="86" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round"/>

  <polygon points="108,72 102,84 114,84" fill="#4A90D9" opacity="0.75"/>
  <line x1="98" y1="86" x2="118" y2="86" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>

  <polygon points="198,72 192,84 204,84" fill="#4A90D9"/>
  <circle cx="194" cy="88" r="2.5" fill="#4A90D9"/>
  <circle cx="202" cy="88" r="2.5" fill="#4A90D9"/>
  <line x1="188" y1="91" x2="208" y2="91" stroke="#4A90D9" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Span 1: positive influence curve -->
  <path d="M18,72 Q63,38 108,72" fill="#F2A623" fill-opacity="0.18"/>
  <path d="M18,72 Q63,38 108,72" stroke="#F2A623" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Span 2: negative influence curve -->
  <path d="M108,72 Q153,88 198,72" fill="#E85D24" fill-opacity="0.18"/>
  <path d="M108,72 Q153,88 198,72" stroke="#E85D24" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Node dots -->
  <circle cx="18"  cy="72" r="3.5" fill="#4A90D9"/>
  <circle cx="108" cy="72" r="3.5" fill="#4A90D9"/>
  <circle cx="198" cy="72" r="3.5" fill="#4A90D9"/>

  <!-- Moving load (vehicle icon) -->
  <rect x="96" y="16" width="26" height="7" rx="2" fill="#F2A623" fill-opacity="0.25" stroke="#F2A623" stroke-width="1"/>
  <circle cx="102" cy="24" r="2.5" fill="#F2A623"/>
  <circle cx="116" cy="24" r="2.5" fill="#F2A623"/>
  <line x1="109" y1="23" x2="109" y2="38" stroke="#F2A623" stroke-width="2" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- ── Text zone (right x=216..384) ──────────────────────────────────── -->

  <!-- Separator line -->
  <line x1="212" y1="22" x2="212" y2="98" stroke="#4A90D9" stroke-width="0.5" stroke-opacity="0.4"/>

  <!-- Main title -->
  <text x="226" y="52"
        font-family="Arial, sans-serif" font-size="20" font-weight="700"
        fill="#E8F4FF" letter-spacing="0.5">Influence</text>
  <text x="226" y="76"
        font-family="Arial, sans-serif" font-size="20" font-weight="700"
        fill="#4A90D9" letter-spacing="0.5">Line</text>

  <!-- Subtitle -->
  <text x="226" y="96"
        font-family="Arial, sans-serif" font-size="10" font-weight="400"
        fill="#7AAECF" letter-spacing="0.8">CONTINUOUS BEAM ANALYSIS</text>
</svg>
